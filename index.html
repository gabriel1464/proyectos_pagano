<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proyectos · Marcela Pagano</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Atkinson+Hyperlegible+Next:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet" />
    <style>
        *{box-sizing:border-box;margin:0}
        :root{
            --azul:#0A2342;--azul-2:#123B67;--azul-suave:#1D4E85;
            --celeste-claro:#BFDDF2;--celeste-niebla:#EAF2FA;
            --papel:#F5F7FA;--papel-2:#FAFBFD;--blanco:#FFF;
            --tinta:#10213A;--tinta-2:#44536A;--tinta-3:#7C8AA0;
            --linea:#DEE4EC;--linea-suave:#EBEFF4;
            --oro:#C8A24B;--oro-suave:#F3E9D3;
            --ley:#1F7A63;--ley-fondo:#E5F3EE;
            --res:#B5541E;--res-fondo:#FBEBE0;
            --dec:#38428C;--dec-fondo:#E9EAF6;
            --f-display:'Fraunces',Georgia,serif;--f-texto:'Atkinson Hyperlegible Next',sans-serif;
            --radio:10px;--radio-chico:6px;
        }
        @media(prefers-reduced-motion:reduce){*{transition-duration:0ms!important;animation-duration:0ms!important}}
        html{scroll-behavior:smooth}
        body{font-family:var(--f-texto);background:var(--papel);color:var(--tinta);line-height:1.6}
        a{color:inherit}
        :focus-visible{outline:2.5px solid var(--oro);outline-offset:2px;border-radius:3px}
        .banda-patria{height:5px;background:linear-gradient(90deg,#5B9BD5,#BFDDF2 50%,#5B9BD5)}
        .ancho{max-width:72rem;margin:0 auto;padding:0 clamp(1.1rem,4vw,2.2rem)}

        /* ===== Cabecera ===== */
        .cabecera{background:linear-gradient(160deg,var(--azul) 0%,var(--azul-2) 100%);color:#fff;padding:clamp(2.5rem,6vw,4rem) 0 clamp(3rem,7vw,4.5rem);position:relative;overflow:hidden}
        .cabecera::before{content:"";position:absolute;inset:0;background:radial-gradient(48% 65% at 88% 8%,rgb(200 162 75 / .22),transparent 70%);pointer-events:none}
        .marca{display:inline-flex;align-items:center;gap:.6rem;font-family:var(--f-display);font-size:1.3rem;font-weight:600;color:#fff;text-decoration:none;margin-bottom:clamp(1.8rem,5vw,3rem)}
        .marca svg{width:1.5rem;height:1.5rem;fill:var(--oro);flex-shrink:0}
        .cabecera-cuerpo{display:grid;grid-template-columns:auto 1fr;gap:1.2rem 0;align-items:start;position:relative}
        .numeral{display:flex;align-items:baseline;gap:1rem;grid-column:1 / -1;margin-bottom:.3rem;flex-wrap:wrap}
        .numeral b{font-family:var(--f-display);font-weight:600;font-size:clamp(3.6rem,9vw,7rem);line-height:.85;color:#fff;letter-spacing:-.01em}
        .numeral-etiqueta{font-family:var(--f-display);font-style:italic;font-weight:400;font-size:clamp(1.05rem,2vw,1.35rem);color:var(--celeste-claro);max-width:26ch;line-height:1.35}
        .portada-lead{color:var(--celeste-claro);font-size:1.05rem;max-width:48ch;margin:.6rem 0 clamp(1.8rem,4vw,2.4rem);grid-column:1/-1;opacity:.92}
        .stats-header{display:flex;gap:0;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.18);padding-top:1.4rem;grid-column:1/-1}
        .stat-item{padding:0 1.6rem;border-left:1px solid rgba(255,255,255,.18)}
        .stat-item:first-child{padding-left:0;border-left:none}
        .stat-item strong{display:block;font-family:var(--f-display);font-weight:600;font-size:1.9rem;color:var(--oro);line-height:1.1}
        .stat-item span{font-size:.85rem;color:var(--celeste-claro);opacity:.85}

        /* ===== Filtros ===== */
        .filtros-sticky{position:sticky;top:0;z-index:50;background:rgba(250,251,253,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--linea);padding:1.1rem 0}
        .grupo-filtros-fila{display:flex;gap:.9rem;align-items:baseline;margin-bottom:.7rem}
        .grupo-filtros-fila:last-child{margin-bottom:0}
        .filtro-etiqueta{font-size:.78rem;color:var(--tinta-3);min-width:3rem;flex-shrink:0;padding-top:.5rem}
        .grupo-filtros{display:flex;flex-wrap:wrap;gap:.5rem}
        .pill{background:var(--blanco);border:1.5px solid var(--linea);padding:.4rem 1rem;border-radius:999px;font-weight:600;color:var(--tinta-2);cursor:pointer;transition:border-color .15s,color .15s,background .15s;font-family:var(--f-texto);font-size:.85rem;line-height:1.3}
        .pill:hover{border-color:var(--azul-suave);color:var(--azul)}
        .pill.active{background:var(--azul);color:#fff;border-color:var(--azul)}
        .pill span{margin-left:.35rem;opacity:.7;font-variant-numeric:tabular-nums}

        /* ===== Gráficos ===== */
        .graficos{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin:2.2rem 0}
        .grafico-caja{background:var(--blanco);border:1px solid var(--linea-suave);border-radius:var(--radio);padding:1.5rem}
        .grafico-caja h3{font-family:var(--f-display);font-weight:600;color:var(--azul);margin-bottom:1.1rem;font-size:1.15rem}
        .barras{display:grid;gap:.75rem}
        .barra{display:grid;grid-template-columns:4.5rem 1fr 2.4rem;align-items:center;gap:.8rem}
        .barra-label{font-weight:600;font-size:.9rem;color:var(--tinta-2)}
        .barra-pista{height:8px;background:var(--papel);border-radius:999px;overflow:hidden}
        .barra-relleno{height:100%;background:linear-gradient(90deg,var(--azul-suave),var(--azul));border-radius:inherit;transition:width .4s ease}
        .barra-num{font-weight:700;font-size:.9rem;color:var(--azul);text-align:right;font-variant-numeric:tabular-nums}

        /* ===== Listado de expedientes ===== */
        .libro{background:var(--blanco);border:1px solid var(--linea-suave);border-radius:var(--radio);margin:2.2rem 0 3rem;overflow:hidden}
        .fila{border-bottom:1px solid var(--linea-suave)}.fila:last-child{border-bottom:none}
        .fila-cabecera{display:grid;grid-template-columns:2.2rem 7.5rem 5.5rem 7.5rem 1fr auto;gap:1rem;align-items:center;padding:1.1rem 1.4rem;cursor:pointer;transition:background .15s}
        .fila-cabecera:hover{background:var(--celeste-niebla)}
        .fila-num{font-family:var(--f-display);font-size:1.05rem;color:var(--tinta-3);text-align:center}
        .sello{display:inline-block;font-weight:700;font-size:.72rem;letter-spacing:.02em;padding:.28rem .55rem;border-radius:var(--radio-chico);text-align:center;white-space:nowrap}
        .tipo-ley{color:var(--ley);background:var(--ley-fondo)}
        .tipo-res{color:var(--res);background:var(--res-fondo)}
        .tipo-dec{color:var(--dec);background:var(--dec-fondo)}
        .fila-fecha{font-size:.82rem;color:var(--tinta-3);font-variant-numeric:tabular-nums}
        .fila-tema{font-size:.78rem;font-weight:600;color:var(--azul);background:var(--celeste-niebla);padding:.28rem .65rem;border-radius:999px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .fila-resumen{font-size:.92rem;color:var(--tinta-2);line-height:1.5;word-break:break-word}
        .fila-resumen b{color:var(--tinta);font-weight:700}
        .fila-detalles{display:none;padding:0 1.4rem 1.3rem 4.7rem;background:var(--papel-2);border-top:1px dashed var(--linea)}
        .fila.abierta .fila-detalles{display:block;padding-top:1rem}
        .fila-detalles p{margin-bottom:.5rem;font-size:.92rem;color:var(--tinta-2);max-width:70ch}
        .fila-detalles p strong{color:var(--tinta);font-weight:700}
        .fila-acciones{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem}
        .btn-linea{display:inline-flex;align-items:center;gap:.45rem;padding:.5rem 1rem;border-radius:999px;border:1.5px solid var(--azul);color:var(--azul);background:var(--blanco);font-weight:650;font-size:.83rem;text-decoration:none;transition:background .15s,color .15s}
        .btn-linea svg{width:1rem;height:1rem;fill:none;stroke:currentColor;stroke-width:1.8;flex-shrink:0}
        .btn-linea:hover{background:var(--azul);color:#fff}
        .btn-detalle{background:transparent;border:1.5px solid var(--linea);color:var(--tinta-2);border-radius:999px;padding:.4rem 1rem;font-weight:600;cursor:pointer;font-size:.83rem;white-space:nowrap;transition:border-color .15s,color .15s}
        .btn-detalle:hover{border-color:var(--azul-suave);color:var(--azul)}
        .cargando{text-align:center;padding:3.5rem 1.5rem;font-size:1.05rem;color:var(--tinta-3)}
        .cargando.error{color:var(--res)}

        @media(max-width:900px){.fila-cabecera{grid-template-columns:2rem 6.5rem 4.8rem 1fr auto}.fila-tema{display:none}.fila-detalles{padding-left:2.9rem}.graficos{grid-template-columns:1fr}}
        @media(max-width:700px){.fila-cabecera{grid-template-columns:1.6rem 5.6rem 3.8rem 1fr auto;padding:.95rem 1rem;gap:.7rem}.fila-fecha{font-size:.72rem}.fila-resumen{font-size:.85rem}.sello{font-size:.66rem;padding:.22rem .4rem}.btn-detalle{font-size:.75rem;padding:.35rem .7rem}.fila-detalles{padding-left:1rem}.stat-item{padding:0 1rem}}
        @media(max-width:500px){.fila-cabecera{grid-template-columns:1.3rem 4.6rem 1fr auto}.fila-fecha{display:none}.fila-resumen{font-size:.8rem}.sello{font-size:.62rem}.filtro-etiqueta{min-width:2.4rem}}
    </style>
</head>
<body>
    <header class="cabecera">
        <div class="ancho">
            <a class="marca" href="#">
                <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="5.4"/><path d="M15.21 8.84L16 .8L16.79 8.84ZM18.08 9.11L20.67 4.73L19.41 9.66ZM20.5 10.38L26.75 5.25L21.62 11.5ZM22.34 12.59L27.27 11.33L22.89 13.92ZM23.16 15.21L31.2 16L23.16 16.79ZM22.89 18.08L27.27 20.67L22.34 19.41ZM21.62 20.5L26.75 26.75L20.5 21.62ZM19.41 22.34L20.67 27.27L18.08 22.89ZM16.79 23.16L16 31.2L15.21 23.16ZM13.92 22.89L11.33 27.27L12.59 22.34ZM11.5 21.62L5.25 26.75L10.38 20.5ZM9.66 19.41L4.73 20.67L9.11 18.08ZM8.84 16.79L.8 16L8.84 15.21ZM9.11 13.92L4.73 11.33L9.66 12.59ZM10.38 11.5L5.25 5.25L11.5 10.38ZM12.59 9.66L11.33 4.73L13.92 9.11Z"/></svg>
                <span>Proyectos</span>
            </a>
            <div class="cabecera-cuerpo">
                <p class="numeral"><b id="total-proyectos">…</b><span class="numeral-etiqueta">proyectos presentados ante la Cámara de Diputados</span></p>
                <p class="portada-lead">El trabajo legislativo de la diputada nacional Marcela Pagano, documentado y disponible para su consulta.</p>
                <div class="stats-header">
                    <div class="stat-item"><strong id="total-leyes">…</strong><span>Leyes</span></div>
                    <div class="stat-item"><strong id="total-resoluciones">…</strong><span>Resoluciones</span></div>
                    <div class="stat-item"><strong id="total-declaraciones">…</strong><span>Declaraciones</span></div>
                </div>
            </div>
        </div>
    </header>
    <div class="banda-patria"></div>

    <div class="filtros-sticky">
        <div class="ancho">
            <div class="grupo-filtros-fila">
                <span class="filtro-etiqueta">Tipo</span>
                <div class="grupo-filtros" id="filtros-tipo">
                    <button class="pill active" data-filtro="todos" onclick="filtrarTipo('todos', this)">Todos <span id="tipo-total">0</span></button>
                    <button class="pill" data-filtro="Ley" onclick="filtrarTipo('Ley', this)">Leyes <span id="tipo-Ley">0</span></button>
                    <button class="pill" data-filtro="Resolución" onclick="filtrarTipo('Resolución', this)">Resoluciones <span id="tipo-Resolución">0</span></button>
                    <button class="pill" data-filtro="Declaración" onclick="filtrarTipo('Declaración', this)">Declaraciones <span id="tipo-Declaración">0</span></button>
                </div>
            </div>
            <div class="grupo-filtros-fila">
                <span class="filtro-etiqueta">Año</span>
                <div class="grupo-filtros" id="filtros-anio">
                    <button class="pill active" data-anio="todos" onclick="filtrarAnio('todos', this)">Todos</button>
                </div>
            </div>
            <div class="grupo-filtros-fila">
                <span class="filtro-etiqueta">Tema</span>
                <div class="grupo-filtros" id="filtros-tema">
                    <button class="pill active" data-tema="todos" onclick="filtrarTema('todos', this)">Todos</button>
                </div>
            </div>
        </div>
    </div>

    <div class="ancho">
        <div class="graficos">
            <div class="grafico-caja"><h3>Proyectos por año</h3><div class="barras" id="grafico-anio"></div></div>
            <div class="grafico-caja"><h3>Distribución por tipo</h3><div class="barras" id="grafico-tipo"></div></div>
        </div>
        <div class="libro" id="libro"><div class="cargando">Cargando expedientes…</div></div>
    </div>

    <script>
        // ===== CONFIGURACIÓN =====
        const JSON_URL = 'https://raw.githubusercontent.com/gabriel1464/denunciometro/main/expedientes.json';

        let proyectos = [];
        let filtros = { tipo: 'todos', anio: 'todos', tema: 'todos' };
        let filtrosAnio = new Set();
        let filtrosTema = new Set();

        // ===== CARGAR DATOS =====
        async function cargarDatos() {
            try {
                const resp = await fetch(JSON_URL);
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                proyectos = await resp.json();
                // Extraer años y temas
                proyectos.forEach(p => {
                    if (p.anio) filtrosAnio.add(p.anio);
                    if (p.tema) filtrosTema.add(p.tema);
                });
                const anios = Array.from(filtrosAnio).sort((a,b) => b - a);
                const temas = Array.from(filtrosTema).sort();

                // Llenar filtros de año
                const contAnio = document.getElementById('filtros-anio');
                contAnio.innerHTML = `<button class="pill active" data-anio="todos" onclick="filtrarAnio('todos', this)">Todos</button>`;
                anios.forEach(anio => {
                    const count = proyectos.filter(p => p.anio === anio).length;
                    const btn = document.createElement('button');
                    btn.className = 'pill';
                    btn.dataset.anio = anio;
                    btn.innerHTML = `${anio} <span>${count}</span>`;
                    btn.onclick = function() { filtrarAnio(anio, this); };
                    contAnio.appendChild(btn);
                });

                // Llenar filtros de tema
                const contTema = document.getElementById('filtros-tema');
                contTema.innerHTML = `<button class="pill active" data-tema="todos" onclick="filtrarTema('todos', this)">Todos</button>`;
                temas.forEach(tema => {
                    const count = proyectos.filter(p => p.tema === tema).length;
                    const btn = document.createElement('button');
                    btn.className = 'pill';
                    btn.dataset.tema = tema;
                    btn.innerHTML = `${tema} <span>${count}</span>`;
                    btn.onclick = function() { filtrarTema(tema, this); };
                    contTema.appendChild(btn);
                });

                actualizarTodo();
            } catch (e) {
                document.getElementById('libro').innerHTML = `<div class="cargando error">No se pudieron cargar los expedientes (${e.message}). Recargá la página para reintentar.</div>`;
                console.error(e);
            }
        }

        // ===== ACTUALIZAR ESTADÍSTICAS, GRÁFICOS Y LISTA =====
        function actualizarTodo() {
            const total = proyectos.length;
            const leyes = proyectos.filter(p => p.tipo === 'Ley').length;
            const res = proyectos.filter(p => p.tipo === 'Resolución').length;
            const dec = proyectos.filter(p => p.tipo === 'Declaración').length;

            document.getElementById('total-proyectos').textContent = total;
            document.getElementById('total-leyes').textContent = leyes;
            document.getElementById('total-resoluciones').textContent = res;
            document.getElementById('total-declaraciones').textContent = dec;
            document.getElementById('tipo-total').textContent = total;
            document.getElementById('tipo-Ley').textContent = leyes;
            document.getElementById('tipo-Resolución').textContent = res;
            document.getElementById('tipo-Declaración').textContent = dec;

            // Gráfico años
            const anios = Array.from(filtrosAnio).sort((a,b) => a - b);
            const maxAnio = Math.max(...anios.map(a => proyectos.filter(p => p.anio === a).length), 1);
            const contAnio = document.getElementById('grafico-anio');
            contAnio.innerHTML = '';
            anios.forEach(anio => {
                const count = proyectos.filter(p => p.anio === anio).length;
                const pct = (count / maxAnio * 100);
                const barra = document.createElement('div');
                barra.className = 'barra';
                barra.innerHTML = `
                    <span class="barra-label">${anio}</span>
                    <div class="barra-pista"><div class="barra-relleno" style="width:${pct}%"></div></div>
                    <span class="barra-num">${count}</span>
                `;
                contAnio.appendChild(barra);
            });

            // Gráfico tipo
            const tipos = ['Ley', 'Resolución', 'Declaración'];
            const maxTipo = Math.max(...tipos.map(t => proyectos.filter(p => p.tipo === t).length), 1);
            const contTipo = document.getElementById('grafico-tipo');
            contTipo.innerHTML = '';
            tipos.forEach(tipo => {
                const count = proyectos.filter(p => p.tipo === tipo).length;
                const pct = (count / maxTipo * 100);
                const barra = document.createElement('div');
                barra.className = 'barra';
                barra.innerHTML = `
                    <span class="barra-label">${tipo}</span>
                    <div class="barra-pista"><div class="barra-relleno" style="width:${pct}%"></div></div>
                    <span class="barra-num">${count}</span>
                `;
                contTipo.appendChild(barra);
            });

            renderLista();
        }

        function renderLista() {
            const libro = document.getElementById('libro');
            const filtrados = proyectos.filter(p => {
                const okTipo = filtros.tipo === 'todos' || p.tipo === filtros.tipo;
                const okAnio = filtros.anio === 'todos' || p.anio === filtros.anio;
                const okTema = filtros.tema === 'todos' || p.tema === filtros.tema;
                return okTipo && okAnio && okTema;
            });

            if (filtrados.length === 0) {
                libro.innerHTML = `<div class="cargando">No se encontraron proyectos.</div>`;
                return;
            }

            libro.innerHTML = '';
            filtrados.forEach((p, i) => {
                const fila = document.createElement('div');
                fila.className = 'fila';
                let tipoClase = 'tipo-ley';
                if (p.tipo === 'Resolución') tipoClase = 'tipo-res';
                else if (p.tipo === 'Declaración') tipoClase = 'tipo-dec';

                fila.innerHTML = `
                    <div class="fila-cabecera" onclick="toggleFila(this)">
                        <span class="fila-num">${i + 1}</span>
                        <span class="sello ${tipoClase}">${p.tipo}</span>
                        <span class="fila-fecha">${p.fecha}</span>
                        <span class="fila-tema">${p.tema}</span>
                        <span class="fila-resumen"><b>${p.exp}</b> — ${p.resumen}</span>
                        <button class="btn-detalle">Ver más</button>
                    </div>
                    <div class="fila-detalles">
                        <p><strong>Expediente:</strong> ${p.exp}</p>
                        <p><strong>Tema:</strong> ${p.tema}</p>
                        <p><strong>Resumen completo:</strong> ${p.resumen}</p>
                        <div class="fila-acciones">
                            <a class="btn-linea" href="${p.link_pdf}" target="_blank" rel="noopener">
                                <svg viewBox="0 0 24 24"><path d="M7 3h7l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M14 3v5h5"/></svg>
                                PDF original
                            </a>
                            <a class="btn-linea" href="${p.link_web}" target="_blank" rel="noopener">
                                <svg viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M18 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h6"/></svg>
                                Ver en la Cámara
                            </a>
                        </div>
                    </div>
                `;
                libro.appendChild(fila);
            });
        }

        function toggleFila(cabecera) {
            const fila = cabecera.parentElement;
            fila.classList.toggle('abierta');
            cabecera.querySelector('.btn-detalle').textContent = fila.classList.contains('abierta') ? 'Ocultar' : 'Ver más';
        }

        function filtrarTipo(tipo, btn) {
            document.querySelectorAll('#filtros-tipo .pill').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filtros.tipo = tipo;
            renderLista();
        }
        function filtrarAnio(anio, btn) {
            document.querySelectorAll('#filtros-anio .pill').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filtros.anio = anio;
            renderLista();
        }
        function filtrarTema(tema, btn) {
            document.querySelectorAll('#filtros-tema .pill').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filtros.tema = tema;
            renderLista();
        }

        // Exponer globalmente
        window.filtrarTipo = filtrarTipo;
        window.filtrarAnio = filtrarAnio;
        window.filtrarTema = filtrarTema;
        window.toggleFila = toggleFila;

        cargarDatos();
    </script>
</body>
</html>
